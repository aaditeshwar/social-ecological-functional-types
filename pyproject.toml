[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-seft"
version = "0.3.0"
description = "On-demand social-ecological analysis of CoRE Stack districts, tehsils, micro-watersheds and waterbodies."
readme = "docs/core-seft.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "shapely>=2.0",
  "requests>=2.28",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipykernel"]

[tool.setuptools.packages.find]
include = ["core_seft*", "seft*", "knowledge*", "config*"]

[tool.setuptools.package-data]
knowledge = ["*.json", "waterbody/*.json", "impact/*.json"]
config = ["*.json", "groundtruth/*.json", "waterbody/*.json", "impact/*.json"]
